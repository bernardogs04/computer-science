<!DOCTYPE html>

    <title>Meu Caderno - Sabores Pessoais</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<body>
    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-md sticky-top navbar-tema shadow-sm">
        <div class="container-fluid px-3">
            <button class="btn btn-icone d-md-none me-2" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#menuLateral" aria-controls="menuLateral" aria-label="Abrir menu">
                <i class="fa-solid fa-bars"></i>
            </button>

            <a class="navbar-brand marca" href="index.html">
                <i class="fa-solid fa-utensils"></i> Meu Caderno
            </a>

            <form class="d-flex ms-auto busca" role="search" onsubmit="return false;">
                <div class="input-group input-group-sm">
                    <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="search" class="form-control" placeholder="Buscar receitas, restaurantes, tags..."

                </div>

                    aria-labelledby="menuLateralLabel">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title marca" id="menuLateralLabel">
                            <i class="fa-solid fa-utensils"></i> Meu Caderno
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                            data-bs-target="#menuLateral" aria-label="Fechar"></button>
                    </div>
                    <div class="offcanvas-body p-2 p-md-3">
                        <nav class="nav flex-column menu-links w-100">
                            <a class="nav-link destaque-add" href="adicionar.html"><i class="fa-solid fa-plus"></i> Adicionar</a>

                            <a class="nav-link" href="restaurantes.html"><i class="fa-solid fa-store"></i> Restaurantes</a>
                            <a class="nav-link" href="delivery.html"><i class="fa-solid fa-motorcycle"></i> Delivery</a>
                            <a class="nav-link" href="tags.html"><i class="fa-solid fa-tags"></i> Tags</a>
                            <a class="nav-link" href="recentes.html"><i class="fa-solid fa-clock-rotate-left"></i> Recentes</a>
                        </nav>

                </div>

                        <div class="carousel-inner" id="carousel-inner"></div>
                        <button class="carousel-control-prev" type="button"

                        <button class="carousel-control-next" type="button"
                            data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Próximo</span>
